<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AI Recruiting Sourcing Pipeline — by Shravan Kumar Shesham">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070f22"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#10285a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10285a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#0c2145" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0c2145" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <rect x="8" y="8" width="1264" height="624" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- brand row -->
  <g transform="translate(96,92)">
    <rect width="64" height="64" rx="16" fill="url(#logo)"/>
    <text x="32" y="43" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="28" font-weight="800" fill="#04122b" text-anchor="middle">AI</text>
    <text x="84" y="27" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#e8effc">AI Recruiting Sourcing Pipeline</text>
    <text x="84" y="53" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" fill="#9fb3d6">by Shravan Kumar Shesham</text>
  </g>

  <!-- pill -->
  <g transform="translate(96,210)">
    <rect width="330" height="38" rx="19" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="20" y="25" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#7cc0ff">Built on n8n · Evidence-based sourcing</text>
  </g>

  <!-- headline -->
  <text x="96" y="330" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="60" font-weight="800" fill="#e8effc" letter-spacing="-1">From a hiring brief to a</text>
  <text x="96" y="404" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#accent)" letter-spacing="-1">ranked, verified shortlist.</text>

  <!-- subtitle -->
  <text x="96" y="462" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="24" fill="#9fb3d6">AI candidate sourcing, enrichment &amp; recruiter-approved outreach — end to end.</text>

  <!-- stat chips -->
  <g font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" transform="translate(96,512)">
    <g transform="translate(0,0)">
      <rect width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="url(#accent)">11</text>
      <text x="24" y="70" font-size="15" fill="#9fb3d6">automated stages</text>
    </g>
    <g transform="translate(274,0)">
      <rect width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="url(#accent)">0–10</text>
      <text x="24" y="70" font-size="15" fill="#9fb3d6">AI relevance score</text>
    </g>
    <g transform="translate(548,0)">
      <rect width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="url(#accent)">25+</text>
      <text x="24" y="70" font-size="15" fill="#9fb3d6">CRM fields tracked</text>
    </g>
    <g transform="translate(822,0)">
      <rect width="262" height="88" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="url(#accent)">High/Med/Low</text>
      <text x="24" y="70" font-size="15" fill="#9fb3d6">confidence scoring</text>
    </g>
  </g>

  <!-- footer url -->
  <text x="1184" y="120" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" fill="#9fb3d6" text-anchor="end">github.com/shravangithub/ai-recruiting-sourcing-pipeline</text>
</svg>

